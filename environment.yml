      - numpy==1.26.4  # compressai 1.2.8 requires numpy < 2
      - pyyaml==6.0.3
      - accelerate==1.10.1
      - timm==0.9.16
      - compressai==1.2.8
      - lpips==0.1.4
      - DISTS-pytorch==0.1
      - pytorch-msssim==1.0.0
      - torch-fidelity==0.4.0
      - pybind11==3.0.1
      - ninja==1.13.0